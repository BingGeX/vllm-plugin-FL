# vLLM-FL Dispatch Configuration for Kunlunxin vendor
# Auto-loaded when running on Kunlunxin hardware

# Preferred default backend type: flaggems, vendor, reference
prefer: flagos

# Strict Mode:
#   true  = Raise an error immediately on failure; do not attempt other backends.
#   false = Attempt the next available backend in sequence upon failure (Default).
strict: false

# Vendor Whitelist (Optional, allows all if not set)
# allow_vendors:
#  - kunlunxin
#  - cuda

# Vendor Blacklist (Optional)
# deny_vendors:
#   - cuda

# Per-operator backend execution order (Optional)
# Only the backends listed here will be attempted, in the order specified.
#
# Supported tokens:
#   - flagos        : FlagOS implementation
#   - reference     : PyTorch reference implementation
#   - vendor        : Any available vendor backend (auto-detected)
#   - vendor:kunlunxin : Kunlunxin-specific vendor backend
op_backends:
  # attention_backend: prioritize flagos (FlagGems Triton) implementation
  attention_backend:
    - flagos
    - vendor
    - reference

  # rms_norm: prioritize flagos (FlagGems) implementation, fallback to vendor
  rms_norm:
    - flagos
    - vendor
    - reference

  # silu_and_mul: prioritize flagos (FlagGems) implementation, fallback to vendor
  silu_and_mul:
    - flagos
    - vendor
    - reference

  # rotary_embedding: prioritize flagos (FlagGems) implementation, fallback to vendor
  rotary_embedding:
    - flagos
    - vendor
    - reference

  # FLA chunk gated delta rule: vendor (Kunlunxin) implementation
  chunk_gated_delta_rule_fwd:
    - vendor
    - reference

  # FLA fused recurrent gated delta rule: vendor (Kunlunxin) implementation
  fused_recurrent_gated_delta_rule_fwd:
    - vendor
    - reference

  # Causal conv1d forward: vendor (Kunlunxin) implementation
  causal_conv1d_fn:
    - vendor
    - reference

  # Causal conv1d update: vendor (Kunlunxin) implementation
  causal_conv1d_update:
    - vendor
    - reference

  # Fused GDN gating: vendor (Kunlunxin) implementation
  fused_gdn_gating:
    - vendor
    - reference

# FlagOS operator blacklist
# These operators will NOT use FlagOS implementation even if FlagOS is enabled.
flagos_blacklist:
  # --- FlagGems ATen ops known broken on this platform ---
  - _dirichlet_grad
  - _flash_attention_backward
  - _safe_softmax
  - _scaled_dot_product_attention_math
  - _scaled_dot_product_flash_attention_backward
  - argmax
  - bmm
  - index_put_
  # `aten::pow.Scalar` (kernel fn `pow_scalar`) with a float scalar base
  # (`2.0 ** tensor`, e.g. RotaryEmbedding._compute_inv_freq) crashes the
  # Kunlunxin Triton backend: `tl.exp2(y * lnb)` trips
  # "triton_xpu.unpack reached lowering without a bufPtr" in ConvertTritonXPUToLLVM.
  # FlagGems matches flagos_blacklist against the KERNEL FUNCTION name
  # (flag_gems/runtime/op_registrar.py: `item[1].__name__ not in self.exclude_ops`),
  # so the entry MUST be `pow_scalar`; plain `pow` has no effect.
  # Tensor-base forms (pow_tensor_scalar / pow_tensor_tensor) stay on FlagGems.
  - pow_scalar
  - normal_
  - copy_
  # `aten::_to_copy` (kernel fn `to_copy`) kills the Kunlunxin Triton backend
  # with `err_code: -714` (misaligned address) on the P800: during
  # `profile_run` the generated `_to_copy_contiguous_kernel` (Qwen3.6-27B eager)
  # and `_to_copy_func_close_interleave_kernel_rank_3` (Qwen3.6-35B-A3B, 3-D
  # non-contiguous RMSNorm input) both fail with
  # `xpuLaunchKernel ... Exception in kernel execution`, taking the EngineCore
  # down with an async "illegal memory access". A dtype cast has no reason to
  # use a generated kernel, so keep it on the vendor torch path.
  - to_copy
  - gelu
  - masked_scatter_
  - scatter
  - scatter_
  - scatter_add_
  - select_scatter
  - slice
  - slice_scatter
  - softmax
  - sort
  - topk_softmax
  - attention_backend
  # --- OOT ops never registered through FlagGems ---
  - chunk_gated_delta_rule_fwd
  - fused_recurrent_gated_delta_rule_fwd
  - causal_conv1d_fn
  - causal_conv1d_update
  - fused_gdn_gating


# OOT (Out-of-Tree) operator blacklist
# These operators will NOT be registered as OOT replacements.
# oot_blacklist:
#   - fused_moe
