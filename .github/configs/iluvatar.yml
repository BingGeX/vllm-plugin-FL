# Iluvatar CoreX (BI-V150) CI configuration.
# ci_image published 2026-09-30:
#   harbor.baai.ac.cn/plugin/vllm-plugin-fl:v0.28.0-iluvatar-ci
#   digest sha256:cc8ed9969977a06996c86c483851567f212ab9761bb9147e85082b4a34ce88b8
# Jobs need a self-hosted runner matching the labels below.

platform: iluvatar

ci_image: harbor.baai.ac.cn/plugin/vllm-plugin-fl:v0.28.0-iluvatar-ci

runner_labels:
  - self-hosted
  - Linux
  - X64
  - iluvatar
  - bi-v150

container_volumes:
  - /data:/data
  - /mnt/share:/mnt/share

container_options: >-
  --privileged
  --ipc=host
  --hostname vllm-plugin-fl-iluvatar
  --user root
  --env VLLM_PLUGINS=fl
  --env USE_FLAGGEMS=1
  --env GEMS_VENDOR=iluvatar
  --ulimit nofile=65535:65535
