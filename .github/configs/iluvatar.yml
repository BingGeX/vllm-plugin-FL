# Iluvatar CoreX (BI-V150) CI configuration.
# Harbor image + self-hosted runner are NOT published yet (DOCKER_BIN=no on
# the adaptation host). Keep platforms.yml `iluvatar.enabled: false` until
# ci_image and runner_labels point at a real CoreX CI image/runner.

platform: iluvatar

# Placeholder — replace after Harbor publishes a CoreX CI image.
ci_image: harbor.baai.ac.cn/plugin/vllm-plugin-fl:v0.28.0-iluvatar-ci

# Placeholder — replace with the real self-hosted CoreX runner labels.
runner_labels:
  - self-hosted
  - Linux
  - X64
  - iluvatar
  - bi-v150

container_volumes:
  - /data:/data
  - /mnt/share:/mnt/share

container_options: >-
  --privileged
  --ipc=host
  --hostname vllm-plugin-fl-iluvatar
  --user root
  --env VLLM_PLUGINS=fl
  --env USE_FLAGGEMS=1
  --env GEMS_VENDOR=iluvatar
  --ulimit nofile=65535:65535
